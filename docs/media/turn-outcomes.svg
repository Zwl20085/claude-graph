<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Turn outcomes in Windows mode. After a node's message is delivered, the turn ends in one of three ways. Done: the turn ended and the reply does not ask anything; the node is succeeded or failed by its deliverables and the next node's message goes in. Question: the reply's last lines ask you something; the node turns violet, needs you, and the chain pauses until you answer in the app or in the window, or press Skip this question, continue the chain. Dialog: while the turn runs the agent shows a choice list or a permission prompt; the options appear in the app and your choice is answered with the keys the agent expects. Conservative rule: a question counts as an offer, and the chain goes on, only when the node declares deliverables and all of them were written.">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3a3a3a"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="470" fill="#1e1e1e"/>
  <rect width="1200" height="470" fill="url(#dots)"/>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" fill="#e5e5e5">
    <!-- the delivered message -->
    <rect x="30" y="150" width="250" height="120" rx="8" fill="#262626" stroke="#3b82f6" stroke-width="2"/>
    <rect x="30" y="150" width="250" height="6" rx="3" fill="#3b82f6"/>
    <text x="48" y="184" font-size="17" font-weight="700">Message delivered</text>
    <text x="48" y="206" font-size="12" fill="#a1a1aa">submit confirmed, node running</text>
    <text x="48" y="230" font-size="12" fill="#a1a1aa">the app follows the turn: hooks,</text>
    <text x="48" y="248" font-size="12" fill="#a1a1aa">transcript, the screen</text>

    <path d="M280 190 C 320 190, 320 75, 356 75" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ahg)"/>
    <path d="M280 210 L356 210" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#ahv)"/>
    <path d="M280 230 C 320 230, 320 345, 356 345" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahv)"/>

    <!-- done -->
    <rect x="360" y="30" width="400" height="92" rx="8" fill="#262626" stroke="#22c55e" stroke-width="2"/>
    <text x="378" y="58" font-size="16" font-weight="700" fill="#22c55e">done</text>
    <text x="430" y="58" font-size="12" fill="#a1a1aa">turn ended, the reply asks nothing</text>
    <text x="378" y="82" font-size="12" fill="#e5e5e5">deliverables present: succeeded; missing: failed</text>
    <text x="378" y="104" font-size="12" fill="#71717a">no deliverables declared: the end of the turn is enough</text>

    <!-- question -->
    <rect x="356" y="161" width="408" height="100" rx="11" fill="none" stroke="#a78bfa" stroke-width="5" filter="url(#glow)" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="360" y="165" width="400" height="92" rx="8" fill="#262626" stroke="#a78bfa" stroke-width="2"/>
    <text x="378" y="193" font-size="16" font-weight="700" fill="#a78bfa">question</text>
    <text x="458" y="193" font-size="12" fill="#a1a1aa">turn ended, the last lines ask you</text>
    <text x="378" y="217" font-size="12" fill="#e5e5e5">"Should I…?", "Let me know…", a list of options</text>
    <text x="378" y="239" font-size="12" fill="#71717a">node: needs you · chain: paused</text>

    <!-- dialog -->
    <rect x="360" y="300" width="400" height="92" rx="8" fill="#262626" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="378" y="328" font-size="16" font-weight="700" fill="#a78bfa">dialog</text>
    <text x="440" y="328" font-size="12" fill="#a1a1aa">turn still running, a choice is on screen</text>
    <text x="378" y="352" font-size="12" fill="#e5e5e5">a choice list, AskUserQuestion, "Do you want to proceed?"</text>
    <text x="378" y="374" font-size="12" fill="#71717a">node: needs you · paused by the dialog itself</text>

    <!-- consequences -->
    <path d="M760 76 L836 76" stroke="#22c55e" stroke-width="2" marker-end="url(#ahg)"/>
    <rect x="840" y="40" width="330" height="72" rx="8" fill="#262626" stroke="#52525b"/>
    <text x="858" y="68" font-size="14" font-weight="700">Next node's message goes in</text>
    <text x="858" y="92" font-size="12" fill="#a1a1aa">failed + stop_on_failure: the chain stops</text>

    <path d="M760 211 L836 211" stroke="#a78bfa" stroke-width="2" marker-end="url(#ahv)"/>
    <rect x="840" y="165" width="330" height="92" rx="8" fill="#262626" stroke="#52525b"/>
    <text x="858" y="191" font-size="14" font-weight="700">Answer in the app (Chat) or the window</text>
    <text x="858" y="213" font-size="12" fill="#a1a1aa">the answer is typed as the next message</text>
    <text x="858" y="235" font-size="12" fill="#a1a1aa">or: Skip this question — continue the chain</text>

    <path d="M760 346 L836 346" stroke="#a78bfa" stroke-width="2" marker-end="url(#ahv)"/>
    <rect x="840" y="300" width="330" height="92" rx="8" fill="#262626" stroke="#52525b"/>
    <text x="858" y="326" font-size="14" font-weight="700">Options shown in the app</text>
    <text x="858" y="348" font-size="12" fill="#a1a1aa">your choice is sent as keys: digit, arrows,</text>
    <text x="858" y="370" font-size="12" fill="#a1a1aa">Space, Enter; or answer in the window</text>

    <!-- rule -->
    <rect x="30" y="414" width="1140" height="40" rx="8" fill="#1a1a2e" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="48" y="439" font-size="13" fill="#c4b5fd"><tspan font-weight="700">Conservative rule.</tspan> A question pauses the chain. Only if the node declares deliverables and all were written is it an offer: succeeded, chain goes on.</text>
  </g>
</svg>
