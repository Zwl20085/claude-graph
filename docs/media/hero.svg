<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Claude Graph: three node cards wired left to right on a dark dot grid. Literature survey (haiku, green) has succeeded, Layout rule set (opus, violet, cpu tag) is running with a blue ring, Two-page report (sonnet, blue) is pending.">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3a3a3a"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="c1"><rect x="70" y="30" width="280" height="140" rx="8"/></clipPath>
    <clipPath id="c2"><rect x="460" y="62" width="280" height="140" rx="8"/></clipPath>
    <clipPath id="c3"><rect x="850" y="30" width="280" height="140" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="#1e1e1e"/>
  <rect width="1200" height="360" fill="url(#dots)"/>

  <!-- wires -->
  <path d="M350 100 C 405 100, 405 132, 460 132" fill="none" stroke="#22c55e" stroke-width="3"/>
  <path d="M740 132 C 795 132, 795 100, 850 100" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <!-- card 1: haiku, succeeded -->
    <rect x="70" y="30" width="280" height="140" rx="8" fill="#262626"/>
    <g clip-path="url(#c1)"><rect x="70" y="30" width="280" height="36" fill="#22c55e"/></g>
    <rect x="70" y="30" width="280" height="140" rx="8" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="84" y="54" font-size="16" font-weight="700" fill="#ffffff">Literature survey</text>
    <rect x="276" y="40" width="64" height="18" rx="3" fill="#000000" fill-opacity="0.28"/>
    <text x="308" y="54" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">HAIKU</text>
    <text x="84" y="86" font-size="12" fill="#8a8a8a" font-family="Consolas, Menlo, monospace">survey</text>
    <text x="336" y="86" font-size="13" fill="#22c55e" text-anchor="end">succeeded</text>
    <text x="84" y="110" font-size="14" fill="#e5e5e5">Collect the ten most cited papers</text>
    <text x="84" y="129" font-size="14" fill="#e5e5e5">on GaN half-bridge layout</text>
    <text x="336" y="158" font-size="12" fill="#a1a1aa" text-anchor="end">1 deliverable</text>

    <!-- card 2: opus, running -->
    <rect x="456" y="58" width="288" height="148" rx="11" fill="none" stroke="#3b82f6" stroke-width="6" filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="62" width="280" height="140" rx="8" fill="#262626"/>
    <g clip-path="url(#c2)"><rect x="460" y="62" width="280" height="36" fill="#8b5cf6"/></g>
    <rect x="460" y="62" width="280" height="140" rx="8" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="474" y="86" font-size="16" font-weight="700" fill="#ffffff">Layout rule set</text>
    <rect x="672" y="72" width="58" height="18" rx="3" fill="#000000" fill-opacity="0.28"/>
    <text x="701" y="86" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">OPUS</text>
    <text x="474" y="118" font-size="12" fill="#8a8a8a" font-family="Consolas, Menlo, monospace">design</text>
    <text x="726" y="118" font-size="13" fill="#60a5fa" text-anchor="end">running</text>
    <text x="474" y="142" font-size="14" fill="#e5e5e5">Turn the survey into numbered</text>
    <text x="474" y="161" font-size="14" fill="#e5e5e5">rules with numeric limits</text>
    <rect x="474" y="176" width="38" height="18" rx="9" fill="#3f3f46"/>
    <text x="493" y="189" font-size="12" fill="#e5e5e5" text-anchor="middle">cpu</text>
    <text x="726" y="190" font-size="12" fill="#a1a1aa" text-anchor="end">2 deliverables</text>

    <!-- card 3: sonnet, pending -->
    <rect x="850" y="30" width="280" height="140" rx="8" fill="#262626"/>
    <g clip-path="url(#c3)"><rect x="850" y="30" width="280" height="36" fill="#3b82f6"/></g>
    <rect x="850" y="30" width="280" height="140" rx="8" fill="none" stroke="#4b4b4b" stroke-width="1.5"/>
    <text x="864" y="54" font-size="16" font-weight="700" fill="#ffffff">Two-page report</text>
    <rect x="1046" y="40" width="74" height="18" rx="3" fill="#000000" fill-opacity="0.28"/>
    <text x="1083" y="54" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">SONNET</text>
    <text x="864" y="86" font-size="12" fill="#8a8a8a" font-family="Consolas, Menlo, monospace">report</text>
    <text x="1116" y="86" font-size="13" fill="#71717a" text-anchor="end">pending</text>
    <text x="864" y="110" font-size="14" fill="#e5e5e5">Explain the rule set to a</text>
    <text x="864" y="129" font-size="14" fill="#e5e5e5">hardware engineer</text>
    <text x="1116" y="158" font-size="12" fill="#a1a1aa" text-anchor="end">1 deliverable</text>

    <!-- pins -->
    <circle cx="70" cy="100" r="6" fill="#1e1e1e" stroke="#8a8a8a" stroke-width="2.5"/>
    <circle cx="350" cy="100" r="6" fill="#22c55e" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="460" cy="132" r="6" fill="#1e1e1e" stroke="#8a8a8a" stroke-width="2.5"/>
    <circle cx="740" cy="132" r="6" fill="#8b5cf6" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="850" cy="100" r="6" fill="#1e1e1e" stroke="#8a8a8a" stroke-width="2.5"/>
    <circle cx="1130" cy="100" r="6" fill="#3b82f6" stroke="#1e1e1e" stroke-width="2"/>

    <!-- wordmark -->
    <text x="600" y="276" font-size="56" font-weight="700" fill="#f5f5f5" text-anchor="middle" letter-spacing="-1">Claude Graph</text>
    <text x="600" y="314" font-size="22" fill="#a1a1aa" text-anchor="middle">Sequence heavy Claude Code tasks as a blueprint graph.</text>
    <text x="600" y="343" font-size="22" fill="#a1a1aa" text-anchor="middle">Local CLI, no API keys, every run stored with the graph.</text>
  </g>
</svg>
